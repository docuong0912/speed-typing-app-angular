<div class="text-white result-container">
    <div class="confetti-container">
        @for (piece of confettiPieces; track piece.id) {
            <div
                class="confetti-piece"
                [style]="
                    '--delay: ' + piece.delay +
                    '; --duration: ' + piece.duration +
                    '; --left: ' + piece.left +
                    '; --burst-x: ' + piece.burstX +
                    '; --burst-y: ' + piece.burstY +
                    '; --drift-x: ' + piece.driftX +
                    '; --rotate-start: ' + piece.rotateStart +
                    '; --rotate-end: ' + piece.rotateEnd +
                    '; --size: ' + piece.size +
                    '; --color: ' + piece.color +
                    '; --radius: ' + piece.radius
                "></div>
        }
    </div>
    <img src="./assets/images/icon-new-pb.svg" alt="icon new pb" class="w-10 mx-auto mb-4 ">
    <h1 class="text-2xl font-bold text-center mt-5 mb-2">High score Smashed!</h1>
    <p class="text-neutral-400 text-center">You're getting faster. That's incredible typing!</p>
    <app-results-common />
</div>
